name: Self-tests

# The full suite takes about 25 minutes, and a few tests need tools the GitHub runner does not ship (ffmpeg, LibreOffice, pandoc, yt-dlp)
# or assume the developer's time zone and a fast machine. So it is not part of the push gate (build.yml):
# run it by hand from the Actions tab, or let the weekly run do it.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

jobs:
  selftest:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SC_SDK_MAX_MAJOR: "26"
    steps:
      - uses: actions/checkout@v4
      - name: Self-tests
        run: ./build.sh selftest
